# Kitty con apariencia oscura y limpia inspirada en macOS Tahoe.
shell /usr/bin/zsh
font_family Adwaita Mono
bold_font auto
italic_font auto
font_size 13.0

background #1e1e20
foreground #f5f5f7
selection_background #3a3a3c
selection_foreground #ffffff
cursor #0a84ff
cursor_text_color #ffffff

background_opacity 0.88
dynamic_background_opacity yes
hide_window_decorations yes
window_padding_width 14
window_margin_width 0

confirm_os_window_close 0
enable_audio_bell no
cursor_blink_interval 0.7
cursor_stop_blinking_after 15.0

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template " {title} "
active_tab_foreground #ffffff
active_tab_background #3a3a3c
inactive_tab_foreground #8e8e93
inactive_tab_background #242426

map super+enter new_window_with_cwd
map super+t new_tab
map super+w close_tab
map super+shift+] next_tab
map super+shift+[ previous_tab