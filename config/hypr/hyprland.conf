# =====================================================================
# ~/.config/hypr/hyprland.conf
# Configuración estilo macOS Tahoe para Hyprland.
# =====================================================================


# ==================
# MONITORS
# ==================
monitor = , preferred, auto, auto


# ==================
# MY PROGRAMS
# ==================
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun -theme ~/.config/rofi/launchpad.rasi


# ==================
# AUTOSTART
# ==================
exec-once = waybar
exec-once = awww-daemon
exec-once = bash ~/.config/hypr/scripts/macos_dock_state.sh
exec-once = nm-applet
exec-once = hyprpm reload

# Forzar tema oscuro
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'WhiteSur-dark'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'WhiteSur-dark'
exec-once = gsettings set org.gnome.desktop.cursor-theme 'WhiteSur-cursor'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24


# ==================
# ENVIRONMENT VARIABLES
# ==================
env = XCURSOR_THEME,WhiteSur-cursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,WhiteSur-cursor
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,WhiteSur-dark
env = GDK_THEME,WhiteSur-dark
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_STYLE_OVERRIDE,Breeze
env = XDG_CURRENT_DESKTOP,Hyprland:KDE


# ==================
# LOOK AND FEEL
# ==================
general {
    gaps_in = 4
    gaps_out = 12
    border_size = 1

    col.active_border = rgba(ffffff55)
    col.inactive_border = rgba(00000022)

    resize_on_border = true
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = 0x66000000
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.18
    }
}

animations {
    enabled = true
}

bezier = easeOutQuint, 0.23, 1, 0.32, 1
bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
bezier = linear, 0, 0, 1, 1
bezier = quick, 0.15, 0, 0.1, 1
bezier = easy, 0.0, 0.0, 0.0, 1.0

animation = windows, 1, 4.5, easy, popin 90%
animation = windowsIn, 1, 3.5, easy, popin 92%
animation = windowsOut, 1, 2.2, easeOutQuint, popin 92%
animation = fade, 1, 3.0, quick
animation = workspaces, 1, 2.2, easeInOutCubic, slidefade 15%
animation = layers, 1, 3.0, easeOutQuint
animation = layersIn, 1, 3.0, easeOutQuint, fade
animation = layersOut, 1, 1.5, linear, fade

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}


# ==================
# INPUT
# ==================
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_invert = true
}


# ==================
# KEYBINDINGS
# ==================
$mainMod = SUPER

bind = $mainMod, T, exec, $terminal
bind = $mainMod, W, killactive
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, M, exec, bash ~/.config/hypr/scripts/macos_minimize.sh
bind = $mainMod, F, exec, bash ~/.config/hypr/scripts/macos_fullscreen.sh
bind = $mainMod, P, exec, bash ~/.config/eww/scripts/wallpaper_picker.sh
bind = $mainMod CTRL, Q, exec, hyprctl dispatch exit

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


# ==================
# WINDOWS AND WORKSPACES
# ==================

# Todas las ventanas abren FLOTANDO por defecto
windowrulev2 = float, class:(.*)
windowrulev2 = size 1164 601, class:(.*)
windowrulev2 = move 192 71, class:(.*)
windowrulev2 = rounding 12, class:(.*)

# Quitar sombras y bordes al control center de Eww
windowrulev2 = noblur, class:(eww-bar)
windowrulev2 = noshadow, class:(eww-bar)
windowrulev2 = opacity 1.0, class:(eww-bar)

# Blur/glass para tus paneles (Waybar, Wofi, Quickshell Control Center)
layerrule = blur, waybar
layerrule = ignore_alpha 0.6, waybar
layerrule = blur, wofi
layerrule = ignore_alpha 0.6, wofi
